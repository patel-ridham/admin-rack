apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: elastic-system
spec:
  version: 9.1.0
  nodeSets:
  - name: masters
    count: 3
    config:
      node.store.allow_mmap: false
    podTemplate:
      spec:
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
        containers:
        - name: elasticsearch
          resources:
            requests:
              memory: 2Gi
              cpu: 3
            limits:
              memory: 4Gi
              cpu: 8
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: cephfs
        resources:
          requests:
            storage: 500Gi