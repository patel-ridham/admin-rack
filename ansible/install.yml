# setup_containerd_kubernetes_centos9.yaml
---
- name: Install containerd + Kubernetes on CentOS Stream 9
  hosts: all
  become: true

  tasks:
    - name: dnf update with skip-broken + nobest + allowerasing
      dnf:
        name: "*"
        state: latest
        skip_broken: true
        nobest: true
        allowerasing: true

    - name: install required pkgs
      dnf:
        name:
          - curl
          - ca-certificates
          - gnupg2
          - tar
          - policycoreutils
          - dnf-plugins-core
          - container-selinux
        state: present

    - name: enable CRB repo
      command: dnf config-manager --enable crb
      changed_when: false
    
    - name: Add Docker repo
      command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      changed_when: false

    - name: dnf update with skip-broken + nobest + allowerasing
      dnf:
        name: "*"
        state: latest
        skip_broken: true
        nobest: true
        allowerasing: true


    - name: Install containerd
      dnf:
        name: containerd.io
        state: present

    - name: Generate containerd config
      command: containerd config default | tee /etc/containerd/config.toml
      creates: /etc/containerd/config.toml

    - name: Enable systemd cgroup driver in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup\s*=\s*false'
        replace: '\1SystemdCgroup = true'

    - name: enable/start containerd
      systemd:
        name: containerd
        enabled: true
        state: started

    - name: add kubernetes repo
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        mode: '0644'
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/repodata/repomd.xml.key

    - name: dnf cache update
      dnf:
        update_cache: true

    - name: install kubernetes
      dnf:
        name:
          - kubelet-1.33.5-150500.1.1
          - kubeadm-1.33.5-150500.1.1
          - kubectl-1.33.5-150500.1.1
        state: present

    - name: install versionlock
      dnf:
        name: python3-dnf-plugin-versionlock
        state: present

    - name: lock kubernetes versions
      command: dnf versionlock add kubelet kubeadm kubectl
      changed_when: false

    - name: swap off
      command: swapoff -a
      changed_when: false

    - name: disable swap in fstab
      replace:
        path: /etc/fstab
        regexp: '^(.*\s+swap\s+.*)$'
        replace: '# \1'

    - name: load overlay module
      modprobe:
        name: overlay

    - name: load br_netfilter module
      modprobe:
        name: br_netfilter

    - name: persist modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: remove broken sysctl drop-in if present
      file:
        path: /etc/sysctl.d/99-sysctl.conf
        state: absent

    - name: ensure kubernetes sysctl file
      copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: apply ONLY our k8s sysctls
      command: sysctl -p /etc/sysctl.d/k8s.conf
      changed_when: false

    - name: set selinux permissive in config
      replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=enforcing'
        replace: 'SELINUX=permissive'
      when: ansible_selinux.status == "enabled"

    - name: setenforce 0 (runtime)
      command: setenforce 0
      ignore_errors: true
      when: ansible_selinux.status == "enabled"

    - name: enable kubelet
      systemd:
        name: kubelet
        enabled: true