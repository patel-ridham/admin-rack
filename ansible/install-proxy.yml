# setup_containerd_kubernetes_centos9.yaml
---
- name: Install containerd + Kubernetes on CentOS Stream 9 (with Proxy Support)
  hosts: all
  become: true
  vars:
    http_proxy: "http://proxy.example.com:8080"
    https_proxy: "http://proxy.example.com:8080"
    no_proxy: "localhost,127.0.0.1,::1,10.0.0.0/8,192.168.0.0/16"

  tasks:
    - name: Copy the proxy configuration script to the remote machine
      copy:
        src: ./install.sh
        dest: /tmp/configure_proxy_with_backup_removal.sh
        mode: '0755'

    - name: Run the proxy configuration script
      command: /tmp/configure_proxy_with_backup_removal.sh
      register: script_output

    - name: Configure system-wide proxy environment
      copy:
        dest: /etc/profile.d/proxy.sh
        mode: '0644'
        content: |
          export http_proxy={{ http_proxy }}
          export https_proxy={{ https_proxy }}
          export no_proxy={{ no_proxy }}
      notify: reload environment

    - name: Set proxy for dnf
      lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '^proxy='
        line: "proxy={{ http_proxy }}"
        create: yes

    - name: dnf update with proxy + skip-broken + nobest + allowerasing
      environment:
        http_proxy: "{{ http_proxy }}"
        https_proxy: "{{ https_proxy }}"
        no_proxy: "{{ no_proxy }}"
      dnf:
        name: "*"
        state: latest
        skip_broken: true
        nobest: true
        allowerasing: true

    - name: install required pkgs
      environment:
        http_proxy: "{{ http_proxy }}"
        https_proxy: "{{ https_proxy }}"
        no_proxy: "{{ no_proxy }}"
      dnf:
        name:
          - curl
          - ca-certificates
          - gnupg2
          - tar
          - policycoreutils
          - dnf-plugins-core
          - container-selinux
        state: present

    - name: enable CRB repo
      command: dnf config-manager --enable crb
      changed_when: false
    
    - name: Add Docker repo (through proxy)
      environment:
        http_proxy: "{{ http_proxy }}"
        https_proxy: "{{ https_proxy }}"
      command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      changed_when: false

    - name: dnf update again with proxy
      environment:
        http_proxy: "{{ http_proxy }}"
        https_proxy: "{{ https_proxy }}"
        no_proxy: "{{ no_proxy }}"
      dnf:
        name: "*"
        state: latest
        skip_broken: true
        nobest: true
        allowerasing: true

    - name: Install containerd
      environment:
        http_proxy: "{{ http_proxy }}"
        https_proxy: "{{ https_proxy }}"
      dnf:
        name: containerd.io
        state: present

    - name: enable/start containerd
      systemd:
        name: containerd
        enabled: true
        state: started

    - name: set SystemdCgroup true + restart containerd
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        systemctl restart containerd

    - name: add kubernetes repo (with proxy vars)
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        mode: '0644'
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/repodata/repomd.xml.key

    - name: dnf cache update
      environment:
        http_proxy: "{{ http_proxy }}"
        https_proxy: "{{ https_proxy }}"
        no_proxy: "{{ no_proxy }}"
      dnf:
        update_cache: true

    - name: install kubernetes
      environment:
        http_proxy: "{{ http_proxy }}"
        https_proxy: "{{ https_proxy }}"
      dnf:
        name:
          - kubelet-1.33.5-150500.1.1
          - kubeadm-1.33.5-150500.1.1
          - kubectl-1.33.5-150500.1.1
        state: present

    - name: install versionlock
      dnf:
        name: python3-dnf-plugin-versionlock
        state: present

    - name: lock kubernetes versions
      command: dnf versionlock add kubelet kubeadm kubectl
      changed_when: false

    - name: swap off
      command: swapoff -a
      changed_when: false

    - name: disable swap in fstab
      replace:
        path: /etc/fstab
        regexp: '^(.*\s+swap\s+.*)$'
        replace: '# \1'

    - name: load overlay module
      modprobe:
        name: overlay

    - name: load br_netfilter module
      modprobe:
        name: br_netfilter

    - name: persist modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: remove broken sysctl drop-in if present
      file:
        path: /etc/sysctl.d/99-sysctl.conf
        state: absent

    - name: ensure kubernetes sysctl file
      copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: apply ONLY our k8s sysctls
      command: sysctl -p /etc/sysctl.d/k8s.conf
      changed_when: false

    - name: set selinux permissive in config
      replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=enforcing'
        replace: 'SELINUX=permissive'
      when: ansible_selinux.status == "enabled"

    - name: setenforce 0 (runtime)
      command: setenforce 0
      ignore_errors: true
      when: ansible_selinux.status == "enabled"

    - name: enable kubelet
      systemd:
        name: kubelet
        enabled: true

    # ----------------------------------------------
    # Proxy for containerd + kubelet systemd services
    # ----------------------------------------------

    - name: Ensure containerd systemd drop-in directory exists
      file:
        path: /etc/systemd/system/containerd.service.d
        state: directory
        mode: '0755'

    - name: Create containerd proxy config
      copy:
        dest: /etc/systemd/system/containerd.service.d/proxy.conf
        mode: '0644'
        content: |
          [Service]
          Environment="HTTP_PROXY={{ http_proxy }}"
          Environment="HTTPS_PROXY={{ https_proxy }}"
          Environment="NO_PROXY={{ no_proxy }}"

    - name: Ensure kubelet systemd drop-in directory exists
      file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        mode: '0755'

    - name: Create kubelet proxy config
      copy:
        dest: /etc/systemd/system/kubelet.service.d/proxy.conf
        mode: '0644'
        content: |
          [Service]
          Environment="HTTP_PROXY={{ http_proxy }}"
          Environment="HTTPS_PROXY={{ https_proxy }}"
          Environment="NO_PROXY={{ no_proxy }}"

    - name: Reload systemd and restart daemons to apply proxy settings
      shell: |
        systemctl daemon-reexec
        systemctl daemon-reload
        systemctl restart containerd
        systemctl restart kubelet
      changed_when: true

  handlers:
    - name: reload environment
      shell: source /etc/profile.d/proxy.sh
